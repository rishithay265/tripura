name: audio
on:
  push:
    paths: ['.github/trigger/au**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VID: uKpiTI20mP8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: pip
        run: python3 -m pip install -q --break-system-packages numpy av 2>&1 | tail -2; python3 -c "import av,numpy;print('av ok',av.__version__)"
      - name: find stream json
        run: |
          mkdir -p evidence/stream evidence/subs
          : > evidence/logs/stream.log
          for H in pipedapi.kavin.rocks pipedapi.adminforge.de api.piped.private.coffee pipedapi.reallyaweso.me pipedapi.leptons.xyz piped-api.lunar.icu; do
            CODE=$(curl -sSL --max-time 25 -A "Mozilla/5.0" "https://$H/streams/$VID" -o /tmp/s.json -w "%{http_code}" 2>>evidence/logs/stream.log)
            SZ=$(stat -c%s /tmp/s.json)
            echo "$H http=$CODE size=$SZ" >> evidence/logs/stream.log
            if [ "$CODE" = "200" ] && grep -q '"audioStreams"' /tmp/s.json; then
              cp /tmp/s.json evidence/stream/streams.json
              echo "USING $H" >> evidence/logs/stream.log
              break
            fi
          done
          ls -la evidence/stream
          python3 - <<'PY'
          import json,sys
          try: d=json.load(open('evidence/stream/streams.json'))
          except Exception as e: print("no json",e); sys.exit(0)
          print("title:",d.get('title'))
          au=d.get('audioStreams') or []
          print("audioStreams:",len(au))
          for a in au[:6]: print("  ",a.get('itag'),a.get('bitrate'),a.get('mimeType'),(a.get('url') or '')[:90])
          su=d.get('subtitles') or []
          print("subtitles:",len(su))
          for s in su[:6]: print("  ",s.get('code'),s.get('name'),(s.get('url') or '')[:120])
          json.dump({'audio':[a.get('url') for a in au if a.get('url')][:3],
                     'subs':[{'code':s.get('code'),'url':s.get('url')} for s in su if s.get('url')]},
                    open('evidence/stream/pick.json','w'))
          PY
      - name: download audio and subs
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          try: p=json.load(open('evidence/stream/pick.json'))
          except Exception as e: print("no pick",e); raise SystemExit(0)
          urls=p.get('audio') or []
          # smallest-bitrate first if available ordering from API; just try each
          for i,u in enumerate(urls):
              out=f'/tmp/a{i}.m4a'
              r=subprocess.run(['curl','-sSL','--max-time','600','-A','Mozilla/5.0','-o',out,u],capture_output=True)
              sz=os.path.getsize(out) if os.path.exists(out) else 0
              print("audio",i,"size",sz)
              if sz>1_000_000:
                  open('evidence/logs/audio_pick.txt','w').write(out)
                  break
          for s in p.get('subs',[])[:4]:
              fn='evidence/subs/sub_%s.vtt'%s['code'].replace('/','_')
              subprocess.run(['curl','-sSL','--max-time','90','-A','Mozilla/5.0','-o',fn,s['url']],capture_output=True)
              print("sub",s['code'],os.path.getsize(fn) if os.path.exists(fn) else 0)
          PY
          ls -la /tmp/a*.m4a evidence/subs 2>/dev/null
          head -20 evidence/subs/*.vtt 2>/dev/null | head -30
      - name: analyse audio
        run: |
          if [ ! -f evidence/logs/audio_pick.txt ]; then echo "no audio"; exit 0; fi
          F=$(cat evidence/logs/audio_pick.txt)
          python3 - "$F" <<'PY'
          import sys, numpy as np, av, os, csv, json
          f=sys.argv[1]
          c=av.open(f)
          st=c.streams.audio[0]
          sr=16000
          res=av.AudioResampler(format='s16', layout='mono', rate=sr)
          chunks=[]
          for frame in c.decode(st):
              for fr in res.resample(frame):
                  chunks.append(fr.to_ndarray().reshape(-1))
          x=np.concatenate(chunks).astype(np.float32)/32768.0
          dur=len(x)/sr
          win=int(sr*0.02); n=len(x)//win
          fr=x[:n*win].reshape(n,win)
          rms=np.sqrt((fr**2).mean(1)+1e-12); rdb=20*np.log10(rms+1e-9)
          loud=np.percentile(rdb,90); thr=max(loud-32,-52); voiced=rdb>thr
          pauses=[];i=0
          while i<n:
              if not voiced[i]:
                  j=i
                  while j<n and not voiced[j]: j+=1
                  d=(j-i)*0.02
                  if d>=0.30: pauses.append((round(i*0.02,2),round(j*0.02,2),round(d,2),round(float(rdb[i:j].mean()),1)))
                  i=j
              else: i+=1
          with open('evidence/audio_pauses.csv','w',newline='') as fh:
              w=csv.writer(fh); w.writerow(['start_s','end_s','duration_s','level_db']); [w.writerow(p) for p in pauses]
          per=int(1/0.02); rows=[]
          for i in range(n//per):
              s=slice(i*per,(i+1)*per)
              rows.append([i,round(float(rdb[s].mean()),2),round(float(voiced[s].mean()),3)])
          with open('evidence/audio_speech_1s.csv','w',newline='') as fh:
              w=csv.writer(fh); w.writerow(['t_s','rms_db','voiced_frac']); [w.writerow(r) for r in rows]
          blocks=[]
          for b in range(0,int(np.ceil(dur/30))):
              s=slice(int(b*30/0.02),min(int((b+1)*30/0.02),n))
              if s.start>=n: break
              blocks.append([b*30,round(float(voiced[s].mean()),3),round(float(rdb[s].mean()),2),
                             round(float(np.percentile(rdb[s],95)-np.percentile(rdb[s],10)),1)])
          with open('evidence/audio_blocks_30s.csv','w',newline='') as fh:
              w=csv.writer(fh); w.writerow(['block_s','speech_ratio','mean_db','dyn_range_db']); [w.writerow(b) for b in blocks]
          pd=np.array([p[2] for p in pauses]) if pauses else np.array([0.0])
          summ=dict(duration_s=round(dur,1),decode_sample_rate=sr,speech_ratio=round(float(voiced.mean()),4),
            voiced_mean_db=round(float(rdb[voiced].mean()),1),unvoiced_mean_db=round(float(rdb[~voiced].mean()),1) if (~voiced).any() else None,
            peak_db=round(float(rdb.max()),1),pause_count=len(pauses),pause_total_s=round(float(pd.sum()),1),
            pause_mean_s=round(float(pd.mean()),2),pause_median_s=round(float(np.median(pd)),2),
            pause_p90_s=round(float(np.percentile(pd,90)),2),pause_max_s=round(float(pd.max()),2),
            pauses_over_2s=int((pd>2).sum()),threshold_db=round(thr,1))
          json.dump(summ,open('evidence/audio_summary.json','w'),indent=1)
          print(json.dumps(summ,indent=1))
          PY
          python3 .github/scripts/subs_to_csv.py evidence/subs evidence/subs 2>&1 | tail -3
          wc -l evidence/subs/*.csv 2>/dev/null
      - name: commit
        if: always()
        run: |
          git config user.name bot; git config user.email bot@x
          git add -A evidence; git commit -m "evidence: audio and caption capture" || echo none
          for i in 1 2 3; do git push origin HEAD && break || sleep 5; git pull --rebase --autostash -q || true; done
